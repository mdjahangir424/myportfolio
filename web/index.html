
<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Md Jahangir Alam - Flutter Developer and AI Automation Specialist.">

  <meta name="author" content="Md Jahangir Alam">
  <meta name="theme-color" content="#2563EB" id="theme-color">

  <title>Md Jahangir Alam | Portfolio</title>

  <script>
    (function () {
      const savedTheme = localStorage.getItem('flutter.isDarkMode');
      const isDark = savedTheme === 'true';

      const background = isDark ? '#0B1120' : '#F8FAFC';

      document.documentElement.style.backgroundColor = background;

      document.documentElement.style.colorScheme =
          isDark ? 'dark' : 'light';

      document.addEventListener('DOMContentLoaded', function () {
        document.body.style.backgroundColor = background;

        document.getElementById('theme-color')
          .setAttribute('content', background);
      });
    })();
  </script>

  <style>
    html, body {
  margin: 0;
  min-height: 100%;
  background-color: transparent;
}

html {
  background-color: #F8FAFC;
}
  </style>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
