name: Flutter Portfolio - Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Check Project
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "Flutter project is not created yet."
            exit 1
          fi

      - name: Configure Flutter Web
        run: flutter create . --platforms web

      - name: Validate and install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze code (fails only on errors)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build Flutter Web
        run: flutter build web --release --base-href /myportfolio/

      - name: Add No Jekyll File
        run: touch build/web/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
