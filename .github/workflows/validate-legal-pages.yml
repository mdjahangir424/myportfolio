name: Validate Portfolio Legal Pages

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Configure Flutter Web
        run: flutter create . --platforms web

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Build Flutter Web
        run: flutter build web --release --base-href /myportfolio/

      - name: Generate route and legal SEO pages
        run: python3 scripts/generate_route_pages.py

      - name: Verify generated legal pages and sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("build/web")
          expected = {
              "privacy-policy": "Privacy Policy",
              "terms-and-conditions": "Terms &amp; Conditions",
              "disclaimer": "Disclaimer",
          }
          for slug, title in expected.items():
              page = root / slug / "index.html"
              assert page.exists(), f"Missing generated page: {page}"
              content = page.read_text(encoding="utf-8")
              assert title in content, f"Missing page title in {page}"
              assert 'name="robots" content="index, follow' in content
              assert 'rel="canonical"' in content

          sitemap = ET.parse(root / "sitemap.xml")
          urls = [
              node.text
              for node in sitemap.findall(
                  ".//{http://www.sitemaps.org/schemas/sitemap/0.9}loc"
              )
          ]
          for slug in expected:
              assert any(url.endswith(f"/{slug}/") for url in urls), (
                  f"{slug} is missing from sitemap.xml"
              )
          print("Legal HTML pages and sitemap validation passed.")
          PY
