name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Verify Flutter SDK
        run: flutter --version

      - name: Enable Flutter web
        run: flutter create . --platforms web

      - name: Validate and install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze code (fails only on errors)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build Flutter web
        run: flutter build web --release --base-href /

      - name: Generate route-specific SEO pages
        run: python3 scripts/generate_route_pages.py

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYPORTFOLIO_F6CFB }}
          projectId: myportfolio-f6cfb
          channelId: live
