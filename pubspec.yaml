name: portfolio
description: Premium personal portfolio website of Md Jahangir Alam - Flutter Developer and AI Automation Specialist.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  flutter_animate: ^4.5.2
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.3.1
  font_awesome_flutter: ^10.8.0
  cached_network_image: ^3.4.1
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
