name: portfolio
description: Premium personal portfolio website of Md Jahangir Alam - Flutter Developer and AI Automation Specialist.
publish_to: 'none'

# Commit pubspec.lock so CI and local builds resolve identical dependency versions.
# Dependency versions are resolved by Flutter and pinned in pubspec.lock.

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  go_router: ^14.6.2
  web: ^1.1.0
  shared_preferences: ^2.5.3
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
